<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Italianno&amp;family=Cinzel:wght@600&amp;display=swap');
      
      .main-text {
        font-family: 'Italianno', 'Apple Chancery', 'Brush Script MT', 'Bickham Script Pro', cursive;
        font-size: 54px;
        fill: #8b1f2d;
        letter-spacing: 1px;
      }
      .sub-text {
        font-family: 'Cinzel', 'Palatino Linotype', 'Book Antiqua', serif;
        font-size: 8.5px;
        letter-spacing: 5px;
        text-transform: uppercase;
        fill: #9a705a;
      }
      .filigree {
        stroke: #d9c18d;
        stroke-width: 0.9;
        fill: none;
      }
    </style>
  </defs>

  <!-- Iniziale decorativa o piccolo fregio a sinistra -->
  <g class="filigree" transform="translate(10, 8)">
    <path d="M 12,20 C 6,10 4,35 15,38 C 22,40 26,24 16,14 C 10,6 2,16 6,28" />
    <circle cx="16" cy="14" r="1.5" fill="#d9c18d" />
  </g>

  <!-- Scritta principale stile cancelleresco -->
  <text x="42" y="46" class="main-text">Digital Lucretius</text>

  <!-- Sottotitolo epigrafico sobrio -->
  <text x="46" y="62" class="sub-text">De Rerum Natura · III</text>

  <!-- Linea guida calligrafica inferiore -->
  <line x1="42" y1="68" x2="395" y2="68" class="filigree" stroke-dasharray="2, 4" />
  <circle cx="398" cy="68" r="1.5" fill="#8b1f2d" />
</svg>
